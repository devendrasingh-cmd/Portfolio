name: Devendra Portfolio CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Check backend syntax
        working-directory: backend
        run: node --check server.js

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build -t devendra-portfolio-frontend:latest ./frontend
      - name: Build backend image
        run: docker build -t devendra-portfolio-backend:latest ./backend

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: [frontend, backend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Configure SSH
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AZURE_SSH_KEY" > ~/.ssh/azure_vm
          chmod 600 ~/.ssh/azure_vm
          ssh-keyscan -H "$AZURE_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on Azure VM
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
        run: |
          ssh -i ~/.ssh/azure_vm "$AZURE_USER@$AZURE_HOST" \
            'cd ~/Portfolio && git pull --ff-only origin main && docker compose up -d --build && docker compose ps'
