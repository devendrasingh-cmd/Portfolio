services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devendra-portfolio-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devendra-portfolio-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
